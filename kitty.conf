font_family JetBrains Mono
bold_font auto
italic_font auto
bold_italic_font auto

font_size 16.0
enable_ligatures always
# Force Kitty to strip the ligature tables out of JetBrains Mono variants
font_features JetBrainsMono-Regular -liga -clig -calt
font_features JetBrainsMono-Bold -liga -clig -calt
font_features JetBrainsMono-Italic -liga -clig -calt
font_features JetBrainsMono-BoldItalic -liga -clig -calt

cursor_shape block
shell_integration no-cursor

cursor_trail 3

scrollback_lines 10000
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell no

remember_window_size no
initial_window_width 1200c
initial_window_height 1200c
hide_window_decorations yes

background_opacity 0.97
dynamic_background_opacity yes
# Increase opacity (make more solid)
map ctrl+shift+a>m set_background_opacity +0.01

# Decrease opacity (make more transparent)
map ctrl+shift+a>l set_background_opacity -0.01

clipboard_control write-clipboard write-primary read-clipboard read-primary

# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME
